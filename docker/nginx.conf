# nginx in front of RustCFML, enabled with RUSTCFML_PROXY=nginx.
#
# This file is a TEMPLATE: the entrypoint substitutes __PORT__ and __SOCKET__
# and writes the result to a writable path, because /etc is read-only to the
# nonroot runtime user.
#
# Runs as the non-root user, so: no `user` directive (nginx ignores it when the
# master is not root), pid and temp paths under writable dirs, logs to
# stdout/stderr for `docker logs`.

worker_processes auto;
pid /var/lib/nginx/nginx.pid;
error_log /dev/stderr warn;

events {
    worker_connections 1024;
}

http {
    # Absolute: with `-c /tmp/nginx.conf` a relative include resolves against the
    # config's own directory, not nginx's prefix.
    include       /etc/nginx/mime.types;
    default_type  application/octet-stream;

    access_log /dev/stdout;

    sendfile      on;
    tcp_nopush    on;
    keepalive_timeout 65;

    # Let the app decide; nginx must not truncate a large upload or download.
    client_max_body_size 0;

    client_body_temp_path /var/lib/nginx/tmp/client_body;
    proxy_temp_path       /var/lib/nginx/tmp/proxy;

    # WebSocket upgrade pass-through (harmless for plain HTTP).
    map $http_upgrade $connection_upgrade {
        default upgrade;
        ''      close;
    }

    upstream rustcfml {
        # A unix socket, not loopback TCP: no three-way handshake, no TIME_WAIT,
        # no ephemeral port exhaustion under load.
        server unix:__SOCKET__;
        keepalive 32;
    }

    server {
        listen      __PORT__;
        server_name _;

        location / {
            proxy_pass http://rustcfml;
            proxy_http_version 1.1;

            proxy_set_header Host              $host;
            proxy_set_header X-Real-IP         $remote_addr;
            proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
            # Preserve the scheme an upstream TLS terminator (Fly, an ALB, an
            # ingress) already recorded; fall back to what nginx itself saw.
            proxy_set_header X-Forwarded-Proto $http_x_forwarded_proto;
            proxy_set_header Upgrade           $http_upgrade;
            proxy_set_header Connection        $connection_upgrade;

            proxy_connect_timeout 5s;
            proxy_read_timeout    60s;
            proxy_send_timeout    60s;
        }

        # Serving static assets from nginx instead of proxying them is the other
        # half of the win. It is OFF by default because it depends on your
        # webroot's layout and can expose files the engine would have refused.
        # To enable, mount a config over this file with something like:
        #
        #   location ^~ /assets/ {
        #       root /app;
        #       expires 30d;
        #       access_log off;
        #   }
    }
}
